name: CI

on:
  push:
    branches: [main, practice-rebase-2]
  pull_request:
    branches: [main, practice-rebase-2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e .

      - name: Run tests
        run: python -m pytest
